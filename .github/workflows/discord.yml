# .github/workflows/discord.yml
name: Discord Notification

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, closed, merged]
  release:
    types: [published]
  create:  # pour les tags

concurrency:
  group: discord-notify-${{ github.ref }}
  cancel-in-progress: true  # évite le spam si plusieurs push rapides

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Définir les variables selon l'event
        id: vars
        run: |
          # Couleur dynamique selon l'event
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "color=16766720" >> $GITHUB_OUTPUT        # 🟡 jaune
            echo "title=🏷️ Nouvelle Release" >> $GITHUB_OUTPUT
            echo "description=${{ github.event.release.name }}" >> $GITHUB_OUTPUT
            echo "url=${{ github.event.release.html_url }}" >> $GITHUB_OUTPUT
            echo "thumbnail=https://cdn-icons-png.flaticon.com/512/2107/2107957.png" >> $GITHUB_OUTPUT

          elif [ "${{ github.event_name }}" = "create" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            echo "color=16753920" >> $GITHUB_OUTPUT        # 🟠 orange
            echo "title=🔖 Nouveau Tag : ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "description=Un nouveau tag a été créé." >> $GITHUB_OUTPUT
            echo "url=https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "thumbnail=https://cdn-icons-png.flaticon.com/512/1828/1828884.png" >> $GITHUB_OUTPUT

          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ github.event.pull_request.merged }}" = "true" ]; then
              echo "color=9699539" >> $GITHUB_OUTPUT       # 🟣 violet (merged)
              echo "title=🔀 PR Mergée" >> $GITHUB_OUTPUT
            elif [ "${{ github.event.action }}" = "opened" ]; then
              echo "color=3447003" >> $GITHUB_OUTPUT       # 🔵 bleu (opened)
              echo "title=📬 Nouvelle PR Ouverte" >> $GITHUB_OUTPUT
            else
              echo "color=15158332" >> $GITHUB_OUTPUT      # 🔴 rouge (closed)
              echo "title=🚫 PR Fermée sans merge" >> $GITHUB_OUTPUT
            fi
            echo "description=${{ github.event.pull_request.title }}" >> $GITHUB_OUTPUT
            echo "url=${{ github.event.pull_request.html_url }}" >> $GITHUB_OUTPUT
            echo "thumbnail=https://cdn-icons-png.flaticon.com/512/2702/2702602.png" >> $GITHUB_OUTPUT

          else
            echo "color=5814783" >> $GITHUB_OUTPUT         # 🟢 vert (push)
            echo "title=🚀 Nouvelle MàJ Github" >> $GITHUB_OUTPUT
            echo "description=${{ github.event.head_commit.message }}" >> $GITHUB_OUTPUT
            echo "url=${{ github.event.head_commit.url }}" >> $GITHUB_OUTPUT
            echo "thumbnail=https://cdn-icons-png.flaticon.com/512/2111/2111432.png" >> $GITHUB_OUTPUT
          fi

      - name: Ping Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d '{
              "content": "<@&1501501489980506183> ${{ steps.vars.outputs.title }}",
              "embeds": [{
                "title": "${{ steps.vars.outputs.title }}",
                "description": "${{ steps.vars.outputs.description }}",
                "url": "${{ steps.vars.outputs.url }}",
                "color": ${{ steps.vars.outputs.color }},
                "thumbnail": {
                  "url": "${{ steps.vars.outputs.thumbnail }}"
                },
                "fields": [
                  {
                    "name": "👤 Auteur",
                    "value": "`${{ github.actor }}`",
                    "inline": true
                  },
                  {
                    "name": "🌿 Branche",
                    "value": "`${{ github.ref_name }}`",
                    "inline": true
                  },
                  {
                    "name": "📦 Repo",
                    "value": "`${{ github.repository }}`",
                    "inline": true
                  },
                  {
                    "name": "🔗 Lien",
                    "value": "${{ steps.vars.outputs.url }}",
                    "inline": false
                  }
                ],
                "footer": {
                  "text": "GitHub Actions • ${{ github.workflow }}"
                },
                "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"
              }]
            }'
